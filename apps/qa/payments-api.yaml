apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-api-qa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    kargo.akuity.io/authorized-stage: payments:qa
spec:
  project: payments-project
  source:
    repoURL: https://github.com/AaronStahley/payments-gitops.git
    targetRevision: stage/qa
    path: manifests/payments-api/overlays/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: payments-qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
